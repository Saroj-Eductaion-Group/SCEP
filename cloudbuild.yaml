steps:
  # 1. Build the image automatically using Buildpacks
  # THIS 'name:' IS NOW CORRECTED
  - name: 'gcr.io/buildpacks/builder:v1'
    args:
      - 'build'
      - '--builder=google/default'
      - '--image=gcr.io/gd-goenka-school/my-app-image:$COMMIT_SHA'
      - '.' # Build the current directory
    
  # 2. Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/gd-goenka-school/my-app-image:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'my-app-service' # This will be the name of your service
      - '--image=gcr.io/gd-goenka-school/my-app-image:$COMMIT_SHA'
      - '--region=us-central1' # Make sure this region is correct
      - '--platform=managed'
      - '--allow-unauthenticated'

# This tells Cloud Build which images to store
images:
  - 'gcr.io/gd-goenka-school/my-app-image:$COMMIT_SHA'

# This option fixes the logging error
options:
  logging: CLOUD_LOGGING_ONLY